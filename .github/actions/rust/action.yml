name: Rust setup
description: Tauri system packages, stable Rust, mold, and the shared build folder used on the laptop.
inputs:
  kind:
    description: Cache name (test or lint)
    required: true
runs:
  using: composite
  steps:
    - name: System packages for Tauri, mold
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
          libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev clang mold
    - name: Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component clippy
        rustup default stable
        rustc --version
    - name: Shared build folder and cargo config
      shell: bash
      run: |
        mkdir -p "$HOME/.cargo" "$HOME/cargo-build-shared"
        sed "s#@BUILD_DIR@#$HOME/cargo-build-shared#" toolings/ci/cargo-config.toml > "$HOME/.cargo/config.toml"
    # One cache for all five apps and the shared folder. Saved even when a step fails.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: |
          apps/dpp/src-tauri
          apps/lawyers/src-tauri
          apps/prisons/src-tauri
          apps/police/src-tauri
          apps/courts/src-tauri
        cache-directories: ~/cargo-build-shared
        key: ${{ inputs.kind }}
        cache-on-failure: true

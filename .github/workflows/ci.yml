name: CI

# ONE pipeline. It runs only when asked, by a token in the commit message (or by
# hand from Actions > CI > Run workflow). A commit with no token runs nothing.
#
#   :test      typecheck, shell tests, cargo test for every app. Nothing else.
#   :lint      clippy and its ratchet for every app. Nothing else.
#   :release   build, sign and publish the Windows installers of all five apps.
#   :all       test, then lint, then release, one after the other (stops at the first failure).
#
# Runs are queued one after another (one CI at a time, nothing is cancelled). Stages and apps also go one at a time.
# Third party actions in the test and lint jobs are pinned to commit SHAs.
# Secrets are used only by the release job.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: What to run
        required: true
        type: choice
        options: [test, lint, release, all]

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2 # same as packageManager in package.json

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.pick.outputs.test }}
      lint: ${{ steps.pick.outputs.lint }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - id: pick
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          CHOICE: ${{ inputs.run }}
        run: |
          text=" $MESSAGE :$CHOICE"
          has() { case "$text" in *":$1"*) echo true ;; *) echo false ;; esac; }
          all=$(has all)
          for job in test lint release; do
            if [ "$all" = true ]; then v=true; else v=$(has "$job"); fi
            echo "$job=$v" >> "$GITHUB_OUTPUT"
            echo "$job=$v"
          done

  typecheck:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Files tsc needs that are gitignored, so a clean checkout lacks them.
      - name: Generate route trees and types
        run: |
          bun toolings/ci/routes.ts apps/*/ www
          cd www
          # Placeholder values only. wrangler types reads the variable NAMES.
          cp .env.ci .env
          bun run i18n
          bun run cf-typegen
      - name: Typecheck
        run: bunx turbo run check
      - name: Shell tests
        run: bun test
        working-directory: packages/shell
      - name: Shell budget
        run: bun toolings/ci/shell-budget.ts

  # One at a time: typecheck, then cargo test, then lint, then release. Each stage
  # needs the one before it, so `:all` runs them in that order and stops at the
  # first failure. Within a stage the apps go one after another in one job, sharing
  # one build folder (toolings/ci/cargo-config.toml), so a dependency is built once.
  cargo-test:
    needs: [plan, typecheck]
    if: ${{ !cancelled() && needs.plan.outputs.test == 'true' && needs.typecheck.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/rust
        with:
          kind: test
      - name: cargo test, app by app
        run: |
          failed=""
          for app in dpp lawyers prisons police courts; do
            echo "::group::cargo test $app"
            toolings/ci/sidecar-placeholders.sh "$app"
            cargo test --manifest-path "apps/$app/src-tauri/Cargo.toml" || failed="$failed $app"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "cargo test failed for:$failed"; exit 1; fi

  lint:
    needs: [plan, typecheck, cargo-test]
    if: ${{ !cancelled() && needs.plan.outputs.lint == 'true' && needs.typecheck.result != 'failure' && needs.cargo-test.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/rust
        with:
          kind: lint
      - name: clippy and the ratchet, app by app
        run: |
          failed=""
          for app in dpp lawyers prisons police courts; do
            echo "::group::clippy $app"
            toolings/ci/sidecar-placeholders.sh "$app"
            out="$RUNNER_TEMP/clippy-$app.jsonl"
            code=0
            cargo clippy --manifest-path "apps/$app/src-tauri/Cargo.toml" \
              --all-targets --message-format=json > "$out" || code=$?
            bun toolings/ci/clippy.ts check "$app" "$out" || code=1
            [ "$code" -eq 0 ] || failed="$failed $app"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "clippy failed for:$failed"; exit 1; fi

  # Windows installers for all five apps, signed for the updater, published to the
  # public phe-rus/pleadli-releases. Each app's version in tauri.conf.json must be
  # above its published feed (docs/RELEASING.md). Courts' first release is allowed
  # to create its own feed.
  release:
    needs: [plan, typecheck, cargo-test, lint]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.typecheck.result != 'failure' && needs.cargo-test.result != 'failure' && needs.lint.result != 'failure' }}
    runs-on: windows-latest
    concurrency:
      group: desktop-release-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [dpp, lawyers, prisons, police, courts]
    env:
      RELEASES_REPO: phe-rus/pleadli-releases
      RELEASE_APP: ${{ matrix.app }}
      RELEASE_TAG: ''
      BOOTSTRAP_COURTS: ${{ matrix.app == 'courts' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      # SQLCipher is built with its own OpenSSL (node-core), which wants NASM on Windows.
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri -> target
          # Keep what compiled even when a later step fails, so a re-run is quick.
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tooling
        run: bun test toolings/releases

      - name: Validate release configuration and tag
        id: version
        shell: bash
        run: bun toolings/releases/release.ts preflight "$RELEASE_APP" "$RELEASE_TAG"

      - name: Require an update newer than the published feed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun toolings/releases/previous-feed.ts "$RELEASE_APP" "$RELEASE_VERSION" previous-feed/latest.json "$BOOTSTRAP_COURTS"

      # The tunnel sidecar is pinned and checked before it enters the installer.
      - name: Fetch verified cloudflared for Windows
        if: matrix.app == 'police' || matrix.app == 'prisons'
        shell: bash
        run: |
          version=$(bun -e 'console.log((await Bun.file("toolings/releases/cloudflared.json").json()).version)')
          expected=$(bun -e 'console.log((await Bun.file("toolings/releases/cloudflared.json").json()).sha256)')
          binary="apps/$RELEASE_APP/src-tauri/binaries/cloudflared-x86_64-pc-windows-msvc.exe"
          mkdir -p "$(dirname "$binary")"
          curl --fail --location --retry 3 -o "$binary" "https://github.com/cloudflare/cloudflared/releases/download/$version/cloudflared-windows-amd64.exe"
          printf '%s  %s\n' "$expected" "$binary" | sha256sum --check --strict

      # The public repository has separate commits. Build into a draft there,
      # and refuse to replace any installer already available to customers.
      - name: Prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="$RELEASE_APP-v$RELEASE_VERSION"
          if gh release view "$tag" -R "$RELEASES_REPO" --json isDraft > release-state.json; then
            bun -e 'if (!(await Bun.file("release-state.json").json()).isDraft) throw new Error("This version is already public. Raise the app version.")'
          else
            gh release create "$tag" -R "$RELEASES_REPO" --draft --target main --title "Pleadli $RELEASE_APP $RELEASE_VERSION" --notes "Windows installers for Pleadli $RELEASE_APP $RELEASE_VERSION. Includes signed updater artifacts; Windows publisher verification is separate."
          fi

      - name: Build and upload draft artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/${{ matrix.app }}
          tauriScript: bunx tauri
          owner: phe-rus
          repo: pleadli-releases
          tagName: ${{ matrix.app }}-v${{ steps.version.outputs.version }}
          releaseName: Pleadli ${{ matrix.app }} ${{ steps.version.outputs.version }}
          releaseBody: Windows installers for Pleadli ${{ matrix.app }} ${{ steps.version.outputs.version }}. Includes signed updater artifacts; Windows publisher verification is separate.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Validate draft assets and upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="$RELEASE_APP-v$RELEASE_VERSION"
          gh release download "$tag" -R "$RELEASES_REPO" -D candidate
          bun toolings/releases/release.ts artifacts "$RELEASE_APP" candidate "$RELEASE_VERSION"
          gh release upload "$tag" candidate/SHA256SUMS.txt -R "$RELEASES_REPO" --clobber

      - name: Publish validated candidate and advance updater
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="$RELEASE_APP-v$RELEASE_VERSION"
          # Recheck immediately before publication. All jobs for this app serialize.
          bun toolings/releases/previous-feed.ts "$RELEASE_APP" "$RELEASE_VERSION" current-feed/latest.json "$BOOTSTRAP_COURTS"
          gh release edit "$tag" -R "$RELEASES_REPO" --draft=false
          if bun -e 'process.exit((await Bun.file("current-feed/latest.json").json()).firstRelease === true ? 0 : 1)'; then
            gh release create "$RELEASE_APP-latest" -R "$RELEASES_REPO" --target main --title "Pleadli $RELEASE_APP updates" --notes "Rolling signed updater feed. Installers are in versioned releases."
          fi
          gh release upload "$RELEASE_APP-latest" candidate/latest.json -R "$RELEASES_REPO" --clobber

name: Release

# Builds a Pleadli desktop app for Windows and publishes the signed installer to
# the public phe-rus/pleadli-releases repository (this repository is private,
# so installed copies could not download from it). Each app also keeps a
# rolling release `<app>-latest` whose latest.json is the endpoint its updater
# reads (plugins.updater.endpoints in the app's tauri.conf.json).
#
# Run it from Actions > Release > Run workflow and pick the app, or push a tag
# such as lawyers-v0.1.1. The version released is the one in the app's
# tauri.conf.json: raise it there before releasing an update.
#
# Secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY  contents of ~/.tauri/pleadli-updater.key
#   RELEASES_TOKEN             a token that can create releases in phe-rus/pleadli-releases

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release
        required: true
        type: choice
        options: [dpp, lawyers, prisons, police, all]
  push:
    tags:
      - 'dpp-v*'
      - 'lawyers-v*'
      - 'prisons-v*'
      - 'police-v*'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            app="${GITHUB_REF_NAME%%-v*}"
          else
            app="${{ inputs.app }}"
          fi
          if [ "$app" = "all" ]; then
            echo 'apps=["dpp","lawyers","prisons","police"]' >> "$GITHUB_OUTPUT"
          else
            echo "apps=[\"$app\"]" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      RELEASES_REPO: phe-rus/pleadli-releases
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      # SQLCipher is built with its own OpenSSL (node-core), which wants NASM on Windows.
      - uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri -> target

      - name: Install dependencies
        run: bun install

      # Police carries Cloudflare's tunnel program beside it (remote access).
      - name: Fetch cloudflared for Windows
        if: matrix.app == 'police'
        shell: bash
        run: curl -fsSL -o apps/police/src-tauri/binaries/cloudflared-x86_64-pc-windows-msvc.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/${{ matrix.app }}/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/${{ matrix.app }}
          tauriScript: bunx tauri
          owner: phe-rus
          repo: pleadli-releases
          tagName: ${{ matrix.app }}-v${{ steps.version.outputs.version }}
          releaseName: Pleadli ${{ matrix.app }} ${{ steps.version.outputs.version }}
          releaseBody: Windows installer for Pleadli ${{ matrix.app }} ${{ steps.version.outputs.version }}. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # The updater reads a fixed address: copy this version's latest.json to
      # the app's rolling `<app>-latest` release.
      - name: Point the updater at this version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          tag="${{ matrix.app }}-v${{ steps.version.outputs.version }}"
          gh release download "$tag" -R "$RELEASES_REPO" -p latest.json -D updater --clobber
          gh release view "${{ matrix.app }}-latest" -R "$RELEASES_REPO" >/dev/null 2>&1 || \
            gh release create "${{ matrix.app }}-latest" -R "$RELEASES_REPO" --title "Pleadli ${{ matrix.app }}: update feed" --notes "Read by installed copies to find updates. Download installers from the versioned releases." --latest=false
          gh release upload "${{ matrix.app }}-latest" updater/latest.json -R "$RELEASES_REPO" --clobber

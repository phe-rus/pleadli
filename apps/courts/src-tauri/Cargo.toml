[package]
name = "courts"
version = "0.1.0"
description = "Pleadli Courts: the bench and courtroom workspace"
authors = ["Pleadli"]
edition = "2021"
default-run = "courts"

[lib]
# The `_lib` suffix keeps the library name from clashing with the bin name on Windows.
name = "courts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["net", "fs", "sync", "time", "io-util", "macros", "rt-multi-thread"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
pleadli-node-core = { path = "../../../packages/node-core" }

[dev-dependencies]
# A fixed key for tests that run domain code without a startup.
pleadli-node-core = { path = "../../../packages/node-core", features = ["test-keys"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package]
name = "dpp"
version = "0.1.0"
description = "Pleadli DPP: prosecution review and charging decisions"
authors = ["Pleadli"]
edition = "2021"
default-run = "dpp"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dpp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tokio = { version = "1", features = ["net", "fs", "sync", "time", "io-util", "macros", "rt-multi-thread"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"
# The key lives in the operating system's keystore where there is one.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
rand_core = { version = "0.6", features = ["getrandom"] }
docx-rs = "0.4.22"
# Authenticator codes (RFC 6238) and the QR code a phone scans to link.
hmac = "0.12"
sha1 = "0.10"
qrcode = "0.14"
# AI Assist calls its provider over HTTPS from here, so the key never reaches the webview.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
pleadli-interchange = { path = "../../../packages/interchange" }
pleadli-node-core = { path = "../../../packages/node-core", features = ["ai"] }

[dev-dependencies]
# A fixed key for tests that run domain code without a startup.
pleadli-node-core = { path = "../../../packages/node-core", features = ["test-keys"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Hashing a PIN or password is deliberately slow; unoptimised it takes
# seconds, which makes a development build feel broken at sign-in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

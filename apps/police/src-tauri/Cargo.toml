[package]
name = "police"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "police_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-frame = "1.1.8"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
log = "0.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ed25519-dalek = "2"
machine-uid = "0.5"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["net", "fs", "sync", "time", "io-util", "macros", "rt-multi-thread"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = "0.14"
local-ip-address = "0.6"
tauri-plugin-shell = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rust_xlsxwriter = "0.99.0"
printpdf = { version = "0.12.8", features = ["images", "jpeg", "png"] }
docx-rs = "0.4.22"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
csv = "1.4.0"
calamine = { version = "0.36.1", features = ["dates"] }
pleadli-node-core = { path = "../../../packages/node-core", features = ["orchestra"] }

[dev-dependencies]
# A fixed key for tests that run domain code without a startup.
pleadli-node-core = { path = "../../../packages/node-core", features = ["test-keys"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Password hashing is deliberately slow; unoptimised it takes many seconds, which
# made first-launch setup and every command sign-in feel hung in `tauri dev`.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Identification photographs</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.08); --blue:#0a84ff; --green:#30d158; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.1); } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:max(20px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom)); }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin:8px 0 4px; }
  p.lead { color:var(--muted); margin:0 0 22px; }
  .stage { background:var(--card); border-radius:22px; padding:22px; text-align:center; box-shadow:0 1px 2px var(--line); }
  .pose { font-size:22px; font-weight:600; margin:6px 0 4px; }
  .how { color:var(--muted); margin:0 0 18px; }
  svg.outline { width:62%; max-width:220px; color:var(--muted); }
  img.preview { width:62%; max-width:220px; aspect-ratio:3/4; object-fit:cover; border-radius:16px; }
  button { appearance:none; border:0; border-radius:14px; font:inherit; font-weight:600; padding:15px 18px; width:100%; margin-top:16px; background:var(--blue); color:#fff; }
  button.plain { background:transparent; color:var(--blue); margin-top:6px; padding:10px; font-weight:500; }
  button:disabled { opacity:.5; }
  .dots { display:flex; justify-content:center; gap:7px; margin:22px 0 0; }
  .dots span { width:7px; height:7px; border-radius:50%; background:var(--line); }
  .dots span.done { background:var(--green); } .dots span.now { background:var(--ink); }
  .done-card h2 { font-size:22px; margin:10px 0 4px; } .tick { font-size:46px; color:var(--green); }
  .err { color:#ff453a; margin-top:12px; font-size:15px; }
  input { display:none; }
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="lead" id="lead"></p>
<div class="stage" id="stage"></div>
<div class="dots" id="dots"></div>
<input id="file" type="file" accept="image/*" capture="environment">
<script>
const sw = (navigator.language || '').toLowerCase().startsWith('sw');
const T = sw ? {
  title:'Picha za utambulisho', lead:'Piga kila picha kwa kamera ya simu hii. Zinaonekana kwenye kompyuta ya kituo mara moja.',
  take:'Piga picha', retake:'Piga tena', skip:'Ruka', sending:'Inatuma…', sent:'Imetumwa', failed:'Haikutumwa. Jaribu tena.',
  done:'Zote zimetumwa', doneHow:'Unaweza kufunga ukurasa huu.',
  poses:{front:['Mbele','Mtu aangalie kamera, kichwa sawa.'], right_profile:['Upande wa kulia','Upande wa kulia wa uso kuelekea kamera.'], left_profile:['Upande wa kushoto','Upande wa kushoto wa uso kuelekea kamera.'], back:['Nyuma','Nyuma ya kichwa kuelekea kamera.']}
} : {
  title:'Identification photographs', lead:'Take each picture with this phone’s camera. It appears on the station computer straight away.',
  take:'Take photo', retake:'Take again', skip:'Skip', sending:'Sending…', sent:'Sent', failed:'It did not send. Try again.',
  done:'All sent', doneHow:'You can close this page.',
  poses:{front:['Front','The person faces the camera, head level.'], right_profile:['Right side','Right side of the face to the camera.'], left_profile:['Left side','Left side of the face to the camera.'], back:['Back','Back of the head to the camera.']}
};
const order = ['front','right_profile','left_profile','back'];
const outlines = {
  front:'M60 18 C76 18 84 30 84 46 C84 64 74 76 60 76 C46 76 36 64 36 46 C36 30 44 18 60 18 Z',
  back:'M60 18 C76 18 84 30 84 46 C84 64 74 76 60 76 C46 76 36 64 36 46 C36 30 44 18 60 18 Z',
  right_profile:'M56 18 C72 18 82 30 82 44 L88 52 L82 56 C82 66 74 76 60 76 C46 76 38 64 38 46 C38 30 42 18 56 18 Z',
  left_profile:'M64 18 C48 18 38 30 38 44 L32 52 L38 56 C38 66 46 76 60 76 C74 76 82 64 82 46 C82 30 78 18 64 18 Z'
};
let step = 0; const sent = {};
document.getElementById('title').textContent = T.title;
document.getElementById('lead').textContent = T.lead;
const stage = document.getElementById('stage'), dots = document.getElementById('dots'), file = document.getElementById('file');

function draw(preview, status, error) {
  dots.innerHTML = order.map((a,i) => `<span class="${sent[a] ? 'done' : i === step ? 'now' : ''}"></span>`).join('');
  if (step >= order.length) { stage.innerHTML = `<div class="done-card"><div class="tick">✓</div><h2>${T.done}</h2><p class="how">${T.doneHow}</p></div>`; return; }
  const a = order[step], [name, how] = T.poses[a];
  stage.innerHTML = `<div class="pose">${name}</div><p class="how">${how}</p>` +
    (preview ? `<img class="preview" src="${preview}" alt="">` : `<svg class="outline" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3"><path d="${outlines[a]}"/><path d="M14 120 C18 92 36 84 60 84 C84 84 102 92 106 120"/></svg>`) +
    `<button id="take" ${status === 'sending' ? 'disabled' : ''}>${status === 'sending' ? T.sending : preview ? T.retake : T.take}</button>` +
    `<button class="plain" id="skip">${T.skip}</button>` + (error ? `<p class="err">${error}</p>` : '');
  document.getElementById('take').onclick = () => file.click();
  document.getElementById('skip').onclick = () => { step++; draw(); };
}

function shrink(f) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = reject; img.src = URL.createObjectURL(f);
  });
}

file.onchange = async () => {
  const f = file.files[0]; file.value = ''; if (!f) return;
  const angle = order[step]; let data;
  try { data = await shrink(f); } catch { draw(null, null, T.failed); return; }
  draw(data, 'sending');
  try {
    const r = await fetch(location.pathname + '/photo', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ angle, data }) });
    if (!r.ok) throw new Error(await r.text());
    sent[angle] = true; step++; draw();
  } catch (e) { draw(data, null, (e && e.message) || T.failed); }
};
draw();
</script>
</body>
</html>

[package]
name = "pleadli-interchange"
version = "0.1.0"
edition = "2021"
description = "The Police and DPP package contract: identities, pairing, and signed, sealed packages that any carrier can move."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
